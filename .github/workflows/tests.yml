name: Research correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-research-lock.txt
      - run: python -m pip install -e '.[dev,research]'
      - run: python -m pytest -q
      - run: python -m cfquant.cli run --config configs/demo.yaml
